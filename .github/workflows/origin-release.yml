name: Origin — Build Windows installer

on:
  push:
    tags:
      - 'origin-v*'
  workflow_dispatch:
    inputs:
      model:
        description: 'Modelo Whisper a empaquetar'
        type: choice
        options: [tiny, base, small, medium, large-v3]
        default: small

permissions:
  contents: write

concurrency:
  # Builds de tag distintos NO se cancelan entre sí (cancel-in-progress: false)
  # — un build largo de tag origin-v0.3.0 no debe abortar por un origin-v0.3.1.
  # Manuales sobre la misma ref tampoco se cancelan; el segundo se encola.
  group: origin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & package (Windows)
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      MODEL: ${{ github.event.inputs.model || 'small' }}

    defaults:
      run:
        shell: pwsh
        working-directory: origin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # uv.lock está gitignored — usamos pyproject.toml como key fallback
          # para que el cache funcione entre runs (sin esto setup-uv tira warning
          # y no cachea nada).
          cache-dependency-glob: 'origin/pyproject.toml'

      - name: Install deps (with dev extras for pyinstaller)
        run: uv sync --extra dev

      # Modelo Whisper: ~485 MB para small, hasta 3 GB para large-v3. Cacheamos
      # entre runs para no repetir el download desde HuggingFace cada vez.
      # `restore-keys` permite reusar cache de versiones anteriores si la key
      # exacta cambia (ej. bumpeo el v1 a v2 pero ya tengo download válido).
      - name: Cache Whisper model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: origin/installer/models/Systran--faster-whisper-${{ env.MODEL }}
          key: whisper-${{ env.MODEL }}-v1
          restore-keys: |
            whisper-${{ env.MODEL }}-

      - name: Install Inno Setup 6
        shell: pwsh
        working-directory: .
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        run: pwsh installer/build_installer.ps1 -Model $env:MODEL

      - name: Show outputs
        # `always()` para ver outputs incluso si el build falló — útil para debug.
        if: always()
        run: |
          if (Test-Path dist) {
            Get-ChildItem -Path dist -Recurse -File | Select-Object FullName, Length
          } else {
            Write-Host "dist/ no existe — el build no llegó al stage de empaquetado"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OriginSetup-${{ env.MODEL }}
          path: origin/dist/OriginSetup-*.exe
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/origin-v')
        uses: softprops/action-gh-release@v2
        with:
          files: origin/dist/OriginSetup-*.exe
          generate_release_notes: true
          name: Origin ${{ github.ref_name }}
          draft: false
          prerelease: false
